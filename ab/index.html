<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>改版对比 · 角色母版回归</title>
<style>:root{color-scheme:dark}body{margin:0;background:#0b0d10;color:#d8dbe0;font:15px/1.65 -apple-system,"PingFang SC",system-ui}
main{max-width:960px;margin:auto;padding:24px 16px 70px}h1{font-size:21px;margin:0 0 6px}
p.sub{color:#9aa1ab;margin:0 0 10px}ul.pts{color:#9aa1ab;margin:0 0 22px;padding-left:18px}
section{margin-bottom:24px}h2{font-size:14.5px;margin:0 0 8px;color:#e7b350;font-weight:600}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}figure{margin:0}
.shot{width:100%;aspect-ratio:9/16;border:0;border-radius:10px;background-color:#000;background-size:cover;background-position:center;cursor:pointer;display:grid;place-items:center;padding:0}
.shot span{width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.35);color:#fff;display:grid;place-items:center;font-size:17px}
video{width:100%;aspect-ratio:9/16;background:#000;border-radius:10px;display:block}
figcaption{font-size:12px;color:#8a9099;margin-top:4px}.new figcaption{color:#e7b350}</style>
<main><h1>改版对比 · 旧版 / 新版</h1>
<p class="sub">左为线上旧版，右为按最初指定的角色母版重做的新版。点一下才加载视频，不会一次性拖垮网络。</p>
<ul class="pts"><li>脸型与冷灰眼回到角色库母版</li><li>渲染统一为半写实 3D</li><li>身形为 1:8.5 清瘦比例，不再壮硕或压缩</li><li>服装、机位、房间、道具保持原样</li></ul>

<script>
document.addEventListener('click',e=>{const b=e.target.closest('.shot'); if(!b)return;
